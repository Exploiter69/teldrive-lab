name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: python -m pytest
      - run: PYTHONPATH="$PWD" python scripts/r0_product_truth_gate.py
      - run: PYTHONPATH="$PWD" python scripts/r1_corpus_discovery_gate.py
      - run: PYTHONPATH="$PWD" python scripts/r2_unified_search_gate.py
      - run: PYTHONPATH="$PWD" python scripts/r3_media_jellyfin_gate.py
      - run: PYTHONPATH="$PWD" python scripts/r4_durable_execution_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase4_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase5_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase6_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase7_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase8_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase9_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase10_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase11_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phases12_22_host_gate.py
