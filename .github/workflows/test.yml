name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: pip install -e .
      - name: Diagnose post-remediation pytest
        run: python scripts/diagnose_pytest_remediation.py
      - name: Upload post-remediation pytest report
        uses: actions/upload-artifact@v4
        with:
          name: remediation-pytest-report
          path: remediation_pytest_report.txt
      - run: python scripts/apply_audit_remediation_v5.py
      - run: python scripts/apply_audit_remediation_v7.py
      - run: python -m compileall -q teldrive_lab tests scripts
      - run: pytest
      - run: PYTHONPATH="$PWD" python scripts/phase4_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase5_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase6_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase7_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase8_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase9_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase10_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase11_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phases12_22_host_gate.py
      - run: git status --short
