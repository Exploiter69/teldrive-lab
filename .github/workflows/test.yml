name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: pip install -e .
      - name: Diagnose remediation patterns
        run: python scripts/diagnose_audit_remediation.py
      - name: Upload remediation diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: remediation-pattern-report
          path: remediation_pattern_report.txt
      - name: Diagnose v2 execution
        run: python scripts/diagnose_v2_execution.py
      - name: Upload v2 execution report
        uses: actions/upload-artifact@v4
        with:
          name: remediation-v2-execution-report
          path: remediation_v2_execution_report.txt
      - run: python scripts/apply_audit_remediation_v2.py
      - run: python scripts/apply_audit_remediation_v3.py
      - run: python -m compileall -q teldrive_lab tests scripts
      - run: pytest
      - run: PYTHONPATH="$PWD" python scripts/phase4_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase5_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase6_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase7_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase8_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase9_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase10_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase11_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phases12_22_host_gate.py
      - run: git status --short
