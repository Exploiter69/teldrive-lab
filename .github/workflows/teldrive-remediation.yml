name: teldrive-remediation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ startsWith(github.event.pull_request.head.ref, 'audit-remediation-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: pip install -e .
      - name: Apply remediation
        if: ${{ !hashFiles('AUDIT_REMEDIATION_APPLIED') }}
        run: |
          python scripts/apply_audit_remediation_v5.py
          python scripts/apply_audit_remediation_v7.py
          touch AUDIT_REMEDIATION_APPLIED
      - run: python -m compileall -q teldrive_lab tests scripts
      - run: pytest
      - run: PYTHONPATH="$PWD" python scripts/phase4_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase5_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase6_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase7_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase8_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase9_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase10_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phase11_host_gate.py
      - run: PYTHONPATH="$PWD" python scripts/phases12_22_host_gate.py
      - name: Clean remediation-only artifacts
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git checkout main -- .github/workflows/test.yml
          git rm -f AUDIT_REMEDIATION_APPLIED AUDIT_REMEDIATION_TRIGGER.md .github/workflows/audit-remediation.yml || true
          git rm -f scripts/apply_audit_remediation.py scripts/apply_audit_remediation_v2.py scripts/apply_audit_remediation_v3.py scripts/apply_audit_remediation_v5.py scripts/apply_audit_remediation_v6.py scripts/apply_audit_remediation_v7.py scripts/diagnose_audit_remediation.py scripts/diagnose_v2_execution.py scripts/diagnose_pytest_remediation.py || true
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes"
          else
            git commit -m "chore: clean audit remediation tooling"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
