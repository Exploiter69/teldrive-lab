[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "teldrive-lab"
version = "0.1.0"
description = "Safe sidecar control plane for an existing TelDrive deployment"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
td = "teldrive_lab.cli_r2:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["teldrive_lab*"]
